<script>
(function () {
  var root = document.documentElement, system = matchMedia("(prefers-color-scheme: dark)"), saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved !== "light" && saved !== "dark") saved = null;
  function pressed() {
    var choice = saved || "auto";
    root.dataset.theme = choice;
    document.querySelectorAll("[data-theme-toggle]").forEach(function (b) {
      b.title = b.getAttribute("data-title-" + choice);
      b.setAttribute("aria-label", b.title);
    });
  }
  function apply(dark) {
    root.classList.toggle("dark", dark);
    root.classList.toggle("light", !dark);
    document.getElementById("chroma-light").media = dark ? "not all" : "all";
    document.getElementById("chroma-dark").media = dark ? "all" : "not all";
    pressed();
    document.dispatchEvent(new CustomEvent("rin:theme", { detail: { dark: dark } }));
  }
  function cycle(from) {
    
    var sys = system.matches ? "dark" : "light", other = sys === "dark" ? "light" : "dark";
    saved = !saved ? other : saved === other ? sys : null;
    try { saved ? localStorage.setItem("theme", saved) : localStorage.removeItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : system.matches;
    if (dark === root.classList.contains("dark")) return pressed();
    var change = function () { apply(dark); };
    if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) return change();
    var box = from.getBoundingClientRect(), x = box.left + box.width / 2, y = box.top + box.height / 2;
    var r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(change).ready.then(function () {
      root.animate(
        { clipPath: ["circle(0 at " + x + "px " + y + "px)", "circle(" + r + "px at " + x + "px " + y + "px)"] },
        { duration: 500, easing: "cubic-bezier(0.4, 0, 0.2, 1)", pseudoElement: "::view-transition-new(root)" }
      );
    });
  }
  apply(saved ? saved === "dark" : system.matches);
  root.dataset.js = "";
  system.addEventListener("change", function () { if (!saved) apply(system.matches); });
  addEventListener("storage", function (e) { if (e.key === "theme") { saved = e.newValue; apply(saved ? saved === "dark" : system.matches); } });
  document.addEventListener("DOMContentLoaded", pressed);
  document.addEventListener("click", function (e) {
    var button = e.target.closest("[data-theme-toggle]");
    if (button) cycle(button);
  });
})();
</script>
